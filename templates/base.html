<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- JavaScript sends this session token with every form submission. -->
  <meta name="csrf-token" content="{{ session['csrf'] }}">
  <title>{% block title %}Fieldwatch — Community early warning{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <script src="{{ url_for('static', filename='scripts/common.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status" hidden></div>
  {% block scripts %}{% endblock %}
</body>
</html>
